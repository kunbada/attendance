name = "attendance-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# database_id 는 배포가이드 순서대로 DB 를 만든 뒤 채워진다 (비밀 값이 아님)
[[d1_databases]]
binding = "DB"
database_name = "attendance"
database_id = "eb820731-a9d1-479d-9788-c51a62d10ecb"

[vars]
# 브라우저에서 이 서버를 부를 수 있는 화면 주소 (쉼표로 구분). 여기 없는 사이트는 브라우저가 막는다.
# "null" = 내 PC에 저장해 둔 계약앱 파일(분양계약관리.html)을 직접 열 때의 주소. 모든 요청에 로그인(토큰)이 필요하므로 데이터는 열리지 않는다.
ALLOWED_ORIGINS = "https://kunbada.github.io,http://localhost:3000,http://localhost:8765,null"
