<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6fb3">
<title>중개업소 조사</title>
<link rel="icon" href="../icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{--accent:#2f6fb3;--accent-d:#1f4f86;--accent-t:#eaf2fb;--bg:#f5f6fa;--card:#fff;--line:#e3e7ee;--text:#18212f;--sub:#6b7686;--err:#d64545;--ok:#1f8a5b;--ok-t:#e7f6ee}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:16px;line-height:1.5}
  .app{max-width:560px;margin:0 auto;padding:0 16px 120px}
  .hero{background:linear-gradient(145deg,var(--accent),var(--accent-d));color:#fff;border-radius:0 0 24px 24px;margin:0 -16px 18px;padding:26px 22px 22px}
  .hero .pj{display:inline-block;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.2);border-radius:20px;padding:3px 12px;margin-bottom:10px}
  .hero h1{margin:0;font-size:23px;letter-spacing:-.4px}
  .hero p{margin:6px 0 0;font-size:14px;opacity:.9}
  .sec{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;margin-bottom:14px}
  .sec h2{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:8px}
  .sec h2 .no{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .sec .desc{margin:0 0 12px;font-size:13.5px;color:var(--sub)}
  .lbl{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
  .lbl em{font-style:normal;color:var(--err);margin-left:3px}
  .lbl small{font-weight:500;color:var(--sub)}
  input[type=text],input[type=tel],input[type=number],textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;background:#fff;color:var(--text);outline:none;transition:.15s}
  input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-t)}
  input.auto,textarea.auto{background:var(--ok-t);border-color:#9fd4b8}
  textarea{min-height:96px;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row2 .lbl{margin-top:14px}
  .consent-box{font-size:13px;color:var(--sub);white-space:pre-wrap;max-height:170px;overflow:auto;background:#f8f9fc;border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.6;margin-bottom:10px}
  .seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .seg.two{grid-template-columns:1fr 1fr}
  .seg.three{grid-template-columns:1fr 1fr 1fr}
  .seg label{position:relative}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:50px;padding:6px 4px;border:1.5px solid var(--line);border-radius:12px;font-size:13.5px;font-weight:600;line-height:1.25;cursor:pointer;background:#fff;word-break:keep-all;transition:.12s}
  .seg input:checked + span{border-color:var(--accent);background:var(--accent);color:#fff}
  .seg input:focus-visible + span{box-shadow:0 0 0 4px var(--accent-t)}
  .cam{display:flex;gap:8px}
  .cam button{flex:1}
  button{font-family:inherit;border:0;cursor:pointer;border-radius:12px;padding:14px;font-size:16px;font-weight:700;transition:.15s}
  button:active{transform:scale(.98)}
  button:disabled{opacity:.5}
  .pri{background:var(--accent);color:#fff}
  .ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
  .preview{display:none;margin-top:12px;align-items:center;gap:12px;font-size:14px;color:var(--sub)}
  .preview.on{display:flex}
  .preview img{width:96px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
  .ocr-msg{font-weight:600}
  .ocr-msg.ok{color:var(--ok)} .ocr-msg.err{color:var(--err)}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .stepper{display:flex;align-items:center;gap:8px}
  .stepper button{width:50px;flex:none;padding:12px 0;background:#fff;border:1.5px solid var(--line);color:var(--text);font-size:20px}
  .stepper input{text-align:center;font-size:18px;font-weight:700}
  .hide{display:none!important}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 75%,rgba(245,246,250,0))}
  .bar .in{max-width:528px;margin:0 auto}
  .bar button{width:100%;font-size:17px;padding:16px;box-shadow:0 8px 18px -8px var(--accent)}
  .msg{color:var(--err);font-size:14px;font-weight:600;min-height:20px;margin:0 0 8px;text-align:center}
  .done{text-align:center;padding:70px 10px}
  .done .ic{width:76px;height:76px;border-radius:50%;background:var(--accent-t);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:38px;font-weight:700}
  .done h2{margin:0 0 6px}
  .done p{color:var(--sub);margin:0 0 24px}
  .done button{width:100%;max-width:280px}
  .note{font-size:12.5px;color:var(--sub);margin:8px 0 0}
</style>
</head>
<body>
<div class="app" id="app"><div class="done"><p>불러오는 중입니다…</p></div></div>
<div class="bar hide" id="bar"><div class="in"><p class="msg" id="msg"></p><button class="pri" id="submit" type="button">제출하기</button></div></div>

<script src="../js/config.js?v=20261113f"></script>
<script>
// 중개업소 조사 화면 (로그인 없음). 주소: /r/?c=링크코드  — 현장마다 링크 1개
// 순서: ① 명함(사진 → AI 가 칸을 채움) ② 조사 내용 ③ 개인정보 제공 동의(기록만 하고, 명함 정보는 동의와 무관하게 저장).
const CODE = (new URLSearchParams(location.search).get('c') || '').trim().toUpperCase();
const $ = (id) => document.getElementById(id);
let FORM = null, NONCE = '', USED_OCR = false, BUSY = false, CARD = '';
const SCALES = {
  market: ['매우 좋음', '좋음', '보통', '나쁨', '매우 나쁨'],
  intent: ['매우 높음', '높음', '보통', '낮음', '매우 낮음'],
  refer: ['매우 높음', '높음', '보통', '낮음', '매우 낮음']
};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function newNonce(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('n-' + Date.now().toString(36) + Math.random().toString(36).slice(2)); }

async function api(action, data){
  let res;
  try { res = await fetch(CONFIG.API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action: action, data: data }) }); }
  catch (e) { throw new Error('네트워크 연결을 확인해 주세요.'); }
  const body = await res.json().catch(() => { throw new Error('서버 응답을 읽을 수 없습니다. 잠시 후 다시 시도해 주세요.'); });
  if (!body.ok) throw new Error(body.error || '요청을 처리하지 못했습니다.');
  return body.data;
}

function showMsg(title, text, again, icon){
  $('bar').classList.add('hide');
  $('app').innerHTML = '<div class="done"><div class="ic">'+(icon||(again?'✓':'!'))+'</div><h2>'+esc(title)+'</h2><p>'+esc(text)+'</p>'+(again?'<button class="pri" onclick="draw()">다음 중개업소 입력</button>':'')+'</div>';
  window.scrollTo(0,0);
}

(async function(){
  if (!CODE) return showMsg('조사 링크가 필요합니다', '받으신 링크(QR)로 접속해 주세요.');
  try { FORM = await api('realtor.form', { code: CODE }); }
  catch (e) { return showMsg('조사 화면을 열 수 없습니다', e.message); }
  if (FORM.closed) return showMsg('사용이 중지된 링크입니다', '관리자에게 문의해 주세요.', false, '🔒');
  draw();
})();

function seg(name, labels){
  // 표시는 좋은 것부터, 값은 5(가장 좋음) … 1
  return '<div class="seg">'+labels.map((l,i)=>'<label><input type="radio" name="'+name+'" value="'+(5-i)+'"><span>'+esc(l)+'</span></label>').join('')+'</div>';
}

function draw(){
  NONCE = newNonce(); USED_OCR = false; BUSY = false; CARD = '';
  $('app').innerHTML =
    '<div class="hero"><span class="pj">'+esc(FORM.projectName)+'</span><h1>중개업소 조사</h1><p>명함을 찍으면 상호·이름·전화·주소가 자동으로 채워집니다.</p></div>'+
    '<div class="sec"><h2><span class="no">1</span>명함 · 중개업소 정보</h2>'+
      '<p class="desc" id="ocrDesc">명함을 찍거나 사진에서 고르면 자동으로 입력됩니다. 틀린 글자는 직접 고쳐 주세요.</p>'+
      '<div class="cam"><button type="button" class="pri" id="btnCam">📷 명함 촬영</button><button type="button" class="ghost" id="btnPick">사진에서 선택</button></div>'+
      '<input type="file" accept="image/*" capture="environment" id="fileCam" class="hide"><input type="file" accept="image/*" id="filePick" class="hide">'+
      '<div class="preview" id="preview"><img id="pimg" alt=""><span class="ocr-msg" id="ocrMsg"></span></div>'+
      '<label class="lbl">상호<em>*</em></label><input type="text" id="officeName" maxlength="60" placeholder="예: 행복공인중개사사무소">'+
      '<div class="row2"><div><label class="lbl">이름</label><input type="text" id="name" maxlength="30"></div><div><label class="lbl">직함</label><input type="text" id="position" maxlength="30" placeholder="대표, 실장 등"></div></div>'+
      '<label class="lbl">휴대폰</label><input type="tel" id="mobile" inputmode="numeric" maxlength="13" placeholder="010-0000-0000">'+
      '<label class="lbl">사무실 전화 <small>(휴대폰과 둘 중 하나는 필수)</small></label><input type="tel" id="officeTel" inputmode="numeric" maxlength="14" placeholder="031-000-0000">'+
      '<label class="lbl">주소</label><input type="text" id="address" maxlength="150"></div>'+
    '<div class="sec"><h2><span class="no">2</span>조사 내용</h2>'+
      '<label class="lbl">시장 동향<em>*</em></label>'+seg('market', SCALES.market)+
      '<label class="lbl">분양 의향<em>*</em></label>'+seg('intent', SCALES.intent)+
      '<label class="lbl">소개 의향<em>*</em></label>'+seg('refer', SCALES.refer)+
      '<label class="lbl">소개 가능 고객 수<em>*</em></label>'+
      '<div class="stepper"><button type="button" id="rcMinus">−</button><input type="number" id="referCount" inputmode="numeric" min="0" max="9999" value="0"><button type="button" id="rcPlus">+</button></div>'+
      '<label class="lbl">부동산 MGM 참여 여부<em>*</em></label>'+
      '<div class="seg three">'+['참여','불참','고려중'].map(v=>'<label><input type="radio" name="mgm" value="'+v+'"><span>'+v+'</span></label>').join('')+'</div>'+
      '<label class="lbl">기타 의견<em>*</em> <small>(없으면 "없음")</small></label><textarea id="opinion" maxlength="1000" placeholder="시장 분위기, 경쟁 현장, 요청 사항 등"></textarea></div>'+
    '<div class="sec"><h2><span class="no">3</span>개인정보 제공 동의 <em style="color:var(--err);font-style:normal">*</em></h2>'+
      '<p class="desc">중개사님께 아래 내용을 안내하고 동의 여부를 골라 주세요.</p>'+
      '<div class="consent-box">'+esc(FORM.consentText)+'</div>'+
      '<div class="seg two"><label><input type="radio" name="consent" value="Y"><span>동의함</span></label><label><input type="radio" name="consent" value="N"><span>동의하지 않음</span></label></div></div>';
  $('bar').classList.remove('hide'); $('msg').textContent = '';
  const sb = $('submit'); sb.disabled = false; sb.textContent = '제출하기'; sb.onclick = submit;

  $('btnCam').onclick = () => $('fileCam').click();
  $('btnPick').onclick = () => $('filePick').click();
  $('fileCam').onchange = $('filePick').onchange = (e) => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) readCard(f); };
  ['mobile','officeTel'].forEach(id => $(id).addEventListener('input', () => fmtTel($(id))));
  document.querySelectorAll('input[type=text],input[type=tel],textarea').forEach(x => x.addEventListener('input', () => x.classList.remove('auto')));
  const rc = $('referCount');
  $('rcMinus').onclick = () => { rc.value = Math.max(0, (parseInt(rc.value,10)||0) - 1); };
  $('rcPlus').onclick = () => { rc.value = Math.min(9999, (parseInt(rc.value,10)||0) + 1); };
  if (!FORM.ocr) { $('ocrDesc').textContent = '명함 자동 인식이 아직 설정되지 않았습니다. 직접 입력해 주세요.'; $('btnCam').disabled = $('btnPick').disabled = true; }
  window.scrollTo(0,0);
}

function consentVal(){ const c = document.querySelector('input[name=consent]:checked'); return c ? c.value === 'Y' : null; }

function fmtTel(el){
  let d = el.value.replace(/\D/g,'').slice(0,11);
  if (/^02/.test(d)) d = d.length > 9 ? d.replace(/^(02)(\d{4})(\d{0,4})$/,'$1-$2-$3') : d.length > 5 ? d.replace(/^(02)(\d{3})(\d{0,4})$/,'$1-$2-$3') : d.length > 2 ? d.slice(0,2)+'-'+d.slice(2) : d;
  else if (/^1[5-9]/.test(d)) d = d.length > 4 ? d.slice(0,4)+'-'+d.slice(4,8) : d;
  else if (d.length > 10) d = d.replace(/^(\d{3})(\d{4})(\d{0,4})$/,'$1-$2-$3');
  else if (d.length > 6) d = d.replace(/^(\d{3})(\d{3})(\d{0,4})$/,'$1-$2-$3');
  else if (d.length > 3) d = d.slice(0,3)+'-'+d.slice(3);
  el.value = d;
}

// 사진을 1280px 이하 JPEG 로 줄여서 보낸다 (전송량·처리 시간 감소)
// steps: [긴 변, 품질] 목록. 결과가 limit(글자 수)보다 작아지면 멈춘다
function shrink(file, steps, limit){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      // 휴대폰 사진(수 MB)을 그대로 보내면 너무 커서 거절된다. 글자를 읽기에 충분한 크기로 줄이고, 그래도 크면 더 줄인다
      let out = '';
      for (const [max, q] of steps) {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', q);
        if (out.length < limit) break;
      }
      URL.revokeObjectURL(url);
      resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('사진을 열 수 없습니다. 다른 사진을 골라 주세요.')); };
    img.src = url;
  });
}

async function readCard(file){
  const m = $('ocrMsg'); $('preview').classList.add('on'); m.className = 'ocr-msg';
  m.innerHTML = '<span class="spin"></span>명함을 읽는 중… (몇 초 걸립니다)';
  $('btnCam').disabled = $('btnPick').disabled = true;
  try {
    const dataUrl = await shrink(file, [[1280, 0.8], [1024, 0.7], [800, 0.6]], 900000);
    // 백업용 명함 사진: 더 작게 (긴 변 1000px, 보통 50~150KB). 제출할 때 함께 저장된다
    CARD = (await shrink(file, [[1000, 0.6], [800, 0.55], [640, 0.5]], 300000)).split(',')[1];
    $('pimg').src = dataUrl;
    const r = await api('realtor.ocr', { code: CODE, mime: 'image/jpeg', image: dataUrl.split(',')[1] });
    let n = 0;
    ['officeName','name','position','mobile','officeTel','address'].forEach(k => { if (r[k]) { $(k).value = r[k]; $(k).classList.add('auto'); n++; } });
    if (n) { USED_OCR = true; m.className = 'ocr-msg ok'; m.textContent = n + '개 칸을 채웠습니다. 초록색 칸이 맞는지 확인해 주세요.'; }
    else { m.className = 'ocr-msg err'; m.textContent = '글자를 찾지 못했습니다. 밝은 곳에서 다시 찍거나 직접 입력해 주세요.'; }
  } catch (e) {
    m.className = 'ocr-msg err'; m.textContent = e.message;
  } finally {
    $('btnCam').disabled = $('btnPick').disabled = false;
  }
}

async function submit(){
  if (BUSY) return;
  const pick = (n) => { const c = document.querySelector('input[name='+n+']:checked'); return c ? Number(c.value) : 0; };
  const mgmEl = document.querySelector('input[name=mgm]:checked');
  const consent = consentVal();
  const d = {
    code: CODE, nonce: NONCE, ocr: USED_OCR, consent: consent, card: CARD,
    officeName: $('officeName').value.trim(), name: $('name').value.trim(), position: $('position').value.trim(), mobile: $('mobile').value.trim(),
    officeTel: $('officeTel').value.trim(), address: $('address').value.trim(),
    market: pick('market'), intent: pick('intent'), refer: pick('refer'), referCount: $('referCount').value.trim(), mgm: mgmEl ? mgmEl.value : '', opinion: $('opinion').value.trim()
  };
  const err = !d.officeName ? '상호를 입력해 주세요.' : (!d.mobile && !d.officeTel) ? '휴대폰 또는 사무실 전화를 입력해 주세요.'
    : !d.market ? '시장 동향을 골라 주세요.' : !d.intent ? '분양 의향을 골라 주세요.' : !d.refer ? '소개 의향을 골라 주세요.'
    : !/^\d{1,4}$/.test(d.referCount) ? '소개 가능 고객 수를 숫자로 입력해 주세요.' : !d.mgm ? '부동산 MGM 참여 여부를 골라 주세요.' : !d.opinion ? '기타 의견을 입력해 주세요. (없으면 "없음")' : consent === null ? '개인정보 제공 동의 여부를 골라 주세요.' : '';
  if (err) { $('msg').textContent = err; return; }
  BUSY = true; const b = $('submit'); b.disabled = true; b.textContent = '제출 중…'; $('msg').textContent = '';
  try {
    await api('realtor.submit', d);
    showMsg('제출되었습니다', (d.officeName) + ' 조사가 저장되었습니다.', true);
  } catch (e) {
    BUSY = false; b.disabled = false; b.textContent = '제출하기'; $('msg').textContent = e.message;
  }
}
</script>
</body>
</html>
