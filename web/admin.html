<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 → 통합관리</title>
  <meta http-equiv="refresh" content="0; url=hub/">
  <link rel="icon" href="icon.svg">
</head>
<body>
  <!-- 관리자 화면은 통합관리(hub)로 옮겨졌다. 북마크가 남아 있어도 자동으로 이동한다. -->
  <p style="font-family:sans-serif;padding:24px">통합관리 화면으로 이동합니다. 이동하지 않으면 <a href="hub/">여기</a>를 눌러 주세요.</p>
  <script>location.replace('hub/' + location.hash);</script>
</body>
</html>
